services:
  marketplace-api:
    image: ${API_IMAGE:-minorsoft/marketplacelanboon-api:latest}
    build:
      context: .
    container_name: ${COMPOSE_PROJECT_NAME:-marketplace}-api
    env_file:
      - ./.env
    environment:
      TZ: ${TZ:-Asia/Bangkok}
      PORT: "47300"
      MARKETPLACE_DATA_DIR: /app/data
      MARKETPLACE_CONTENT_DIR: /app/data/content
      MARKETPLACE_MEDIA_DIR: /app/data/media
      MARKETPLACE_SITE_NAME: ${MARKETPLACE_SITE_NAME:-MarketPlace}
      MARKETPLACE_LICENSE_ENABLED: ${MARKETPLACE_LICENSE_ENABLED:-1}
      MARKETPLACE_LICENSE_KEY: ${MARKETPLACE_LICENSE_KEY:-}
      MARKETPLACE_LICENSE_DB_HOST: ${MARKETPLACE_LICENSE_DB_HOST:-localhost}
      MARKETPLACE_LICENSE_DB_PORT: ${MARKETPLACE_LICENSE_DB_PORT:-5432}
      MARKETPLACE_LICENSE_DB_USER: ${MARKETPLACE_LICENSE_DB_USER:-postgres}
      MARKETPLACE_LICENSE_DB_PASSWORD: ${MARKETPLACE_LICENSE_DB_PASSWORD:-sml}
      MARKETPLACE_LICENSE_DB_NAME: ${MARKETPLACE_LICENSE_DB_NAME:-postgres}
      MARKETPLACE_LICENSE_CHECK_INTERVAL_HOURS: ${MARKETPLACE_LICENSE_CHECK_INTERVAL_HOURS:-24}
      MARKETPLACE_LICENSE_GRACE_HOURS: ${MARKETPLACE_LICENSE_GRACE_HOURS:-24}
    ports:
      - "${HOST_PORT:-47300}:47300"
    volumes:
      - ./data/content:/app/data/content
      - ./data/media:/app/data/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:47300/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s