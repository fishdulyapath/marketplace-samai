server {
    listen 80;

    # Root URL is canonical. Keep old /app bookmarks from serving an index
    # whose absolute /assets URLs cannot be resolved by the gateway.
    location = /app {
        return 301 /;
    }

    location ^~ /app/ {
        return 301 /;
    }

    location / {
        proxy_pass http://marketplace-web:80/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /service/v1/ {
        proxy_pass http://marketplace-api:47300/service/v1/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 25m;
    }

    location /media/ {
        proxy_pass http://marketplace-api:47300/media/;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /health {
        proxy_pass http://marketplace-api:47300/health;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
